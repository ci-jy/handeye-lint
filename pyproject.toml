[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handeye-lint"
version = "0.1.0"
description = "Lint, robustly solve and benchmark hand-eye (AX=XB) calibration inputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.8,<5",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]

[project.scripts]
handeye = "handeye.cli:main"

[tool.setuptools.packages.find]
include = ["handeye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
